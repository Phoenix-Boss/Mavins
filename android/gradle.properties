# Project-wide Gradle settings.

# JVM memory - 4GB for EAS cloud builds with large DSP module
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel + cached builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Architectures
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (required for RN 0.81)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge to edge
edgeToEdgeEnabled=true
expo.edgeToEdgeEnabled=true

# Image support
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Dev client
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Native library packaging
expo.useLegacyPackaging=false

# Minify - keep false so DSP class names survive for runtime wiring
android.enableMinifyInReleaseBuilds=false
android.enableShrinkResourcesInReleaseBuilds=false

# Kotlin version - required by media3 1.8.0

react.bridgeless.enabled=false
