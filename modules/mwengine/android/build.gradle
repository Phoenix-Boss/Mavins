apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.mavin.eq'
version = '1.0.1'

android {
    namespace "expo.modules.mavin.eq"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.1"
        consumerProguardFiles "consumer-rules.pro"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ✅ EXACT PATH TO YOUR CMAKE
    externalNativeBuild {
        cmake {
            path "mwengine-source/mwengine/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    jvmToolchain(17)
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Keep Kotlin stdlib and coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // DO NOT use:
    // implementation project(':expo-modules-core')
    // expo-modules-core comes in via Expo / autolinking
}
