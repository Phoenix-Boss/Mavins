apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TrackPlayer_" + name]
}
def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TrackPlayer_" + name]).toInteger()
}

def media3_version          = "1.6.1"
def lifecycle_version       = "2.8.6"
def coroutines_version      = "1.9.0"
def coil_version            = "2.7.0"

android {
  namespace "com.doublesymmetry.trackplayer"
  compileSdkVersion 36

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion 36
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // Expo Modules Core - required for New Architecture bridgeless support
  implementation project(':expo-modules-core')

  // React Native
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // AndroidX core
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
  implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
  implementation "androidx.media:media:1.7.0"

  // Media3
  implementation "androidx.media3:media3-exoplayer:$media3_version"
  implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
  implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
  implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3_version"
  implementation "androidx.media3:media3-session:$media3_version"
  implementation "androidx.media3:media3-ui:$media3_version"
  implementation "androidx.media3:media3-common:$media3_version"
  implementation "androidx.media3:media3-datasource:$media3_version"
  implementation "androidx.media3:media3-datasource-okhttp:$media3_version"

  // Image loading
  implementation "io.coil-kt:coil:$coil_version"
  implementation "io.coil-kt:coil-base:$coil_version"
  implementation "jp.wasabeef.transformers:coil:1.0.6"

  // Utilities
  implementation "com.google.guava:guava:33.0.0-android"
  api "com.jakewharton.timber:timber:5.0.1"

  // Coroutines
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$coroutines_version"
}

react {
  jsRootDir = file("../src/")
  libraryName = "TrackPlayer"
  codegenJavaPackageName = "com.doublesymmetry.trackplayer"
}