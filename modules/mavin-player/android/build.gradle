apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TrackPlayer_" + name]
}
def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TrackPlayer_" + name]).toInteger()
}

android {
  namespace "com.doublesymmetry.trackplayer"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += ["generated/java", "generated/jni"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // AndroidX core
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
  implementation "androidx.lifecycle:lifecycle-process:2.8.6"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
  implementation "androidx.media:media:1.7.0"

  // Media3 - all pinned to same version to avoid runtime conflicts
  implementation "androidx.media3:media3-exoplayer:1.8.0"
  implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
  implementation "androidx.media3:media3-exoplayer-dash:1.8.0"
  implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.8.0"
  implementation "androidx.media3:media3-session:1.8.0"
  implementation "androidx.media3:media3-ui:1.8.0"
  implementation "androidx.media3:media3-common:1.8.0"
  implementation "androidx.media3:media3-datasource:1.8.0"
  implementation "androidx.media3:media3-datasource-okhttp:1.8.0"

  // Utilities
  implementation "com.google.guava:guava:33.0.0-android"
  api "com.jakewharton.timber:timber:5.0.1"
  implementation "jp.wasabeef.transformers:coil:1.0.6"

  // Coroutines for DSP async ops
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

react {
  jsRootDir = file("../src/")
  libraryName = "TrackPlayer"
  codegenJavaPackageName = "com.doublesymmetry.trackplayer"
}