apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36
    namespace "expo.modules.mavinplayer"

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            pickFirsts += [
                "**/libc++_shared.so",
                "**/libjsc.so"
            ]
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':expo-modules-core')

    // mavin-eq provides EqualizerProcessor, CompressorProcessor, etc.
    implementation project(':mavin-eq')

    // kotlin-stdlib is a transitive dependency — implementation not compileOnly
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"

    // ── Media3 (ExoPlayer) ────────────────────────────────────────────────────
    // 1.6.1 is the latest stable release (1.7.0 was accidentally tagged stable — skip it).
    // All sub-artifacts must use the exact same version string to avoid classpath conflicts.
    def media3_version = "1.6.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // Coroutines — latest stable
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // AndroidX Lifecycle for service
    implementation "androidx.lifecycle:lifecycle-service:2.8.7"

    // AndroidX Core KTX — latest stable
    implementation "androidx.core:core-ktx:1.16.0"

    // USB DAC support
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'

    // AndroidX Media (legacy compat layer — needed for MediaStyle notification compat token)
    implementation "androidx.media:media:1.7.0"
}