apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 34
    namespace "expo.modules.mavinplayer"

    defaultConfig {
        minSdk 24
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        pickFirsts += [
            "**/libc++_shared.so",
            "**/libjsc.so"
        ]
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':expo-modules-core')
    
    // Compile against mavin-eq for the AutoEQ types (stub only)
    implementation project(':mavin-eq')
    
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

    // Media3 (ExoPlayer) - Full playback engine
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"

    // Coroutines for async operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // AndroidX Lifecycle for service
    implementation "androidx.lifecycle:lifecycle-service:2.8.0"
    implementation "androidx.core:core-ktx:1.12.0"
    
    // USB DAC support
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    
    // Audio processing utilities
    implementation "androidx.media:media:1.7.0"
}
