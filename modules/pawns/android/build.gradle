plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'expo-module-gradle-plugin'
}

// Declare JitPack directly in this module so it resolves regardless of
// what the root project's settings.gradle / build.gradle contains.
// This pulls both the wrapper AAR and the transitive NDK AAR automatically.
repositories {
    maven { url 'https://jitpack.io' }
    google()
    mavenCentral()
}

android {
    compileSdk 36
    namespace "expo.modules.mavin.pawns"

    defaultConfig {
        minSdk 24
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            // jniLibs.srcDirs removed — no local AAR/so files needed anymore.
            // The NDK .so files come transitively from JitPack.
        }
    }
}

dependencies {
    // JitPack resolves this as two AARs:
    //   1. internet-sharing-1.8.1.aar  (the wrapper)
    //   2. com.pawns.ndk (NDK/PawnsCore) transitively via the POM
    // Both arrive automatically — no local libs/ folder required.
    implementation 'com.github.Pawns-App:android-pawns-sdk:internet-sharing:1.8.1'

    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}