apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36
    namespace "expo.modules.mavinengine"

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        pickFirsts += [
            "**/libc++_shared.so",
            "**/libjsc.so"
        ]
    }
}

repositories {
    google()
    mavenCentral()
    // ✅ JitPack repository for NewPipeExtractor
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':expo-modules-core')

    // ✅ Kotlin stdlib — matches project-level Kotlin version (2.1.20)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"

    // ✅ UPDATED: NewPipe Extractor — v0.26.0 (latest stable)
    // Breaking change: Service.getMediaCapabilities() returns Set<MediaCapability>
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.0'

    // ✅ OkHttp — used by MavinDownloader
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}