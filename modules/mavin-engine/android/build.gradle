apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36
    namespace "expo.modules.mavinengine"

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        pickFirsts += [
            "**/libc++_shared.so",
            "**/libjsc.so"
        ]
    }
}

repositories {
    google()
    mavenCentral()
    // ✅ CORRECT: JitPack repository for NewPipeExtractor
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':expo-modules-core')

    // ✅ CORRECT: Kotlin stdlib — must match the project-level Kotlin version
    // Using compileOnly or implementation based on Expo's recommendation
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"

    // ✅ UPDATED: NewPipe Extractor — v0.26.0 (latest stable as of Jan 2026)
    // Breaking change: Service.getMediaCapabilities() now returns Set<MediaCapability>
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.0'

    // ✅ CORRECT: OkHttp — used by MavinDownloader
    // v0.26.0 uses OkHttp 5.3.2, but 4.12.0 is compatible for our usage
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}