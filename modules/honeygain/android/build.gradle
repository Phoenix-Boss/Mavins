plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'expo-module-gradle-plugin'
}

android {
    namespace 'expo.modules.mavin.honeygain'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        versionCode 1
        versionName '1.4.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs     = ['src/main/java']
            res.srcDirs      = ['src/main/res']
        }
    }
}

// Expo module DSL
expoModule {
    // Name is derived from package.json / expo-module.config.json automatically
}

dependencies {
    // ── Pawns SDK ─────────────────────────────────────────────────────────────
    // JitPack must be added to dependencyResolutionManagement in settings.gradle:
    //
    //   dependencyResolutionManagement {
    //       repositories {
    //           google()
    //           mavenCentral()
    //           maven { url = uri("https://jitpack.io") }
    //       }
    //   }
    //
    // The Pawns SDK transitively pulls in the coroutines and networking deps it
    // needs, so we do not need to declare them here separately.
    implementation 'app.pawns:android-pawns-sdk:1.8.1'

    // Kotlin stdlib (keep aligned with your Kotlin plugin version)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'

    // JSON parsing for consent log (built into Android SDK — no extra dep needed)
    // org.json is provided by the Android platform; no implementation line required.

    // DO NOT manually depend on expo-modules-core in EAS-style builds.
    // Expo provides it via autolinking / expo package.
}