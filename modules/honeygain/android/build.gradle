plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'expo-module-gradle-plugin'
}

android {
    namespace 'expo.modules.mavin.honeygain'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        versionCode 1
        versionName '1.3.1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            jniLibs.srcDirs = ['libs']
        }
    }
}

// Expo module DSL (no moduleName, no extraProguardRules here)
expoModule {
    // Let Expo derive the name from package.json / expo-module.config.json
    // name = "honeygain-sdk"   // optional, only if plugin actually supports this
    // generateExpoModulesPackageRule = true   // usually handled automatically
}

dependencies {
    // Honeygain SDK + required dependencies
    implementation files('libs/hgsdk.aar')
    implementation 'org.msgpack:msgpack-core:0.9.11'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin stdlib
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'

    // DO NOT manually depend on expo-modules-core in EAS-style builds
    // Expo provides it via autolinking / expo package
}
