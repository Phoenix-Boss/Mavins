// build.gradle (module-level: modules/honeygain/android/build.gradle)
//
// JitPack is declared here via repositories {} so this module is fully
// self-contained. EAS does not touch this file, so no settings.gradle
// entry is needed — and none should be added.

repositories {
    google()
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
}

plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'expo-module-gradle-plugin'
}

android {
    namespace 'expo.modules.mavin.honeygain'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        versionCode 1
        versionName '1.4.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs     = ['src/main/java']
            res.srcDirs      = ['src/main/res']
        }
    }
}

expoModule {
    // Name is derived from package.json / expo-module.config.json automatically
}

dependencies {
    // ── Pawns SDK ─────────────────────────────────────────────────────────────
    // JitPack repo is declared in the repositories {} block at the top of this
    // file — no settings.gradle entry required.
    implementation 'app.pawns:android-pawns-sdk:1.8.1'

    // AndroidX Activity Result APIs (required for registerForActivityResult)
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // Expo modules core is provided transitively via autolinking.
    // Do NOT manually depend on expo-modules-core in EAS-style builds.
}