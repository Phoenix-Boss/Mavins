// modules/mavin-media-session/android/build.gradle (or node_modules/mavin-media-session/android/build.gradle)

plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'expo-module-gradle-plugin'
}

android {
    namespace 'expo.modules.mavin.mediasession'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// NO local repositories block — inherits from root project settings.gradle
// This fixes: "The project declares repositories, effectively ignoring the repositories you have declared in the settings"

expoModule {
    // Name derived from package.json / expo-module.config.json automatically
}

dependencies {
    // expo-modules-core is provided transitively via autolinking
    // Do NOT manually declare implementation 'expo.modules:expo-modules-core'
}