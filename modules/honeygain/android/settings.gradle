// settings.gradle (project-level: android/settings.gradle)

pluginManagement {
    includeBuild(new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle"))
}

plugins {
    id 'com.android.application' version '8.5.0' apply false
    id 'com.android.library' version '8.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'expo-module-gradle-plugin' version '0.17.0' apply false
}

// PREFER_SETTINGS mode (default when dependencyResolutionManagement is declared)
// means ALL repositories must be declared here — project-level build.gradle
// repositories blocks are ignored. This is the correct setup for AGP 7+.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Required for app.pawns:android-pawns-sdk
        maven { url = uri("https://jitpack.io") }
    }
}

rootProject.name = 'mavinsplayer'

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle")
useExpoModules()

include ':app'