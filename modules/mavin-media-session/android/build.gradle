// modules/mavin-media-session/android/build.gradle

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  compileSdk 36
  namespace "expo.modules.maviniMediasession"

  defaultConfig {
    minSdk 24
    versionName "1.0"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')

  compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

  // MediaSessionCompat / PlaybackStateCompat / MediaMetadataCompat
  // (androidx.media — the support-library compat layer, NOT media3)
  implementation 'androidx.media:media:1.7.0'

  // NotificationCompat, ContextCompat
  implementation 'androidx.core:core-ktx:1.13.1'

  // Async artwork loading
  implementation 'com.github.bumptech.glide:glide:4.16.0'

  // Dynamic notification color from album art
  implementation 'androidx.palette:palette-ktx:1.0.0'
}